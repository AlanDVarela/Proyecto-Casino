<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casino Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../styles/casinoUI.css"/>
  <link rel="stylesheet" href="../styles/navbar.css"/>
  <link rel="stylesheet" href="../styles/home.css"/>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #004d00 0%, #8b0000 100%); min-height: 100px; padding: 0 30px;">
            <div class="container-fluid d-flex align-items-center">
              <a class="navbar-brand d-flex align-items-baseline gap-2" href="home.html">
                <span>APUE$TA$</span>
                <span class="brand-777">777</span>
              </a>
          
              <span class="navbar-title mx-auto">CASINO</span>
          
              <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="credits text-white">Créditos Totales: <strong id="totalCredits">$1000</strong></span>
                <div class="dropdown">
                  <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    Usuario
                  </a>
                  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item" href="#">Perfil</a></li>
                    <li><a class="dropdown-item" href="#">Configuración</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
                  </ul>
                </div>
              </div>
          
              <button class="navbar-toggler ms-3" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
            </div>
          
            <div class="collapse navbar-collapse" id="mainNav">
              <ul class="navbar-nav ms-auto me-4">
                <li class="nav-item">
                  <a class="nav-link active" href="home.html">Inicio</a>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="#" id="juegosDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Juegos
                  </a>
                  <ul class="dropdown-menu" aria-labelledby="juegosDropdown">
                    <li><a class="dropdown-item" href="blackjack.html">Blackjack</a></li>
                    <li><a class="dropdown-item" href="ruleta.html">Ruleta</a></li>
                    <li><a class="dropdown-item" href="jackpot.html">Jackpot</a></li>
                  </ul>
                </li>
              </ul>
            </div>
          </nav>
    </header>
    <main>
        <h1 class="title mt-5">BIENVENIDO</h1>
        <div class="container-cards">
          <div class="card">
            <img src="https://www.shutterstock.com/image-vector/blackjack-hand-spades-black-jack-600nw-2122961363.jpg" alt="Blackjack">
            <div class="card-title">BLACKJACK</div>
            <a href="blackjack.html" class="button">Play</a>
          </div>
          <div class="card">
            <img src="assets/ruleta.png" alt="Ruleta">
            <div class="card-title">RULETA</div>
            <a href="ruleta.html" class="button">Play</a>
          </div>
          <div class="card">
            <img src="assets/maquinita.png" alt="Maquinita">
            <div class="card-title">MAQUINITA</div>
            <a href="jackpot.html" class="button">Play</a>
          </div>
        </div>
      </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
