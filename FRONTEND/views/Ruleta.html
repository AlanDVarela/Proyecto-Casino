<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruleta Casino</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  
  <link rel="stylesheet" href="../styles/Roulette/roulette_UI.css"/>
  <link rel="stylesheet" href="../styles/casinoUI.css"/>

</head>
<body>
  <div class="main-wrapper">

   <!-- RUEDA CON FONDO OSCURO -->
      <div class="top-area flex-wrap">
        <!-- Panel izquierdo -->
        <div class="info-wrapper left-info">
          <div id="Card">
            <h5>Balance</h5>
            <p id="balanceAmount">$1000</p>
            <h5>Apuesta</h5>
            <p id="totalBet">$0</p>
            <h5>Ganancia</h5>
            <p id="winningAmount">$0</p>
          </div>
        </div>

        <!-- Centro: Ruleta -->
        <div class="roulette-section">
          <div class="roulette-wrapper" style="position: relative;">
            <canvas id="rouletteCanvas" width="500" height="500"></canvas>
            <div class="pointer"></div>
          </div>
        </div>

        <!-- Panel derecho: ganadores -->
        <div class="info-wrapper right-info">
          <div id="Card">
            <h5>Ganadores</h5>
            <div id="ganadoresList" class="ganadores-scroll"></div>
          </div>
        </div>
      </div>
<div class="bottom-section">
    <!-- MESA DE APUESTAS -->
    <div class="table-area">
      <div class="betting-layout" id="bettingLayout" style="max-width: 90vw;">
        <table class="roulette-table mt-4">
          <tbody>
            <tr>
              <td rowspan="3" class="cell green zero-cell" data-name="0">0</td>
              <td class="cell red" data-name="3">3</td>
              <td class="cell black" data-name="6">6</td>
              <td class="cell red" data-name="9">9</td>
              <td class="cell red" data-name="12">12</td>
              <td class="cell black" data-name="15">15</td>
              <td class="cell red" data-name="18">18</td>
              <td class="cell red" data-name="21">21</td>
              <td class="cell black" data-name="24">24</td>
              <td class="cell red" data-name="27">27</td>
              <td class="cell red" data-name="30">30</td>
              <td class="cell black" data-name="33">33</td>
              <td class="cell red" data-name="36">36</td>
              <td class="cell label" data-name="2to1-top">2 to 1</td>
            </tr>
            <tr>
              <td class="cell black" data-name="2">2</td>
              <td class="cell red" data-name="5">5</td>
              <td class="cell black" data-name="8">8</td>
              <td class="cell black" data-name="11">11</td>
              <td class="cell red" data-name="14">14</td>
              <td class="cell black" data-name="17">17</td>
              <td class="cell black" data-name="20">20</td>
              <td class="cell red" data-name="23">23</td>
              <td class="cell black" data-name="26">26</td>
              <td class="cell black" data-name="29">29</td>
              <td class="cell red" data-name="32">32</td>
              <td class="cell black" data-name="35">35</td>
              <td class="cell label" data-name="2to1-middle">2 to 1</td>
            </tr>
            <tr>
              <td class="cell red" data-name="1">1</td>
              <td class="cell black" data-name="4">4</td>
              <td class="cell red" data-name="7">7</td>
              <td class="cell black" data-name="10">10</td>
              <td class="cell black" data-name="13">13</td>
              <td class="cell red" data-name="16">16</td>
              <td class="cell red" data-name="19">19</td>
              <td class="cell black" data-name="22">22</td>
              <td class="cell red" data-name="25">25</td>
              <td class="cell black" data-name="28">28</td>
              <td class="cell black" data-name="31">31</td>
              <td class="cell red" data-name="34">34</td>
              <td class="cell label" data-name="2to1-bottom">2 to 1</td>
            </tr>
            <tr>
              <td></td>
              <td colspan="4" class="cell label" data-name="1st12">1st 12</td>
              <td colspan="4" class="cell label" data-name="2nd12">2nd 12</td>
              <td colspan="4" class="cell label" data-name="3rd12">3rd 12</td>
              <td></td>
            </tr>
            <tr>
              <td></td>
              <td colspan="2" class="cell label" data-name="1-18">1-18</td>
              <td colspan="2" class="cell label" data-name="even">EVEN</td>
              <td colspan="2" class="cell red" data-name="red">RED</td>
              <td colspan="2" class="cell black" data-name="black">BLACK</td>
              <td colspan="2" class="cell label" data-name="odd">ODD</td>
              <td colspan="2" class="cell label" data-name="19-36">19-36</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FICHAS + BOTONES -->
    <div class="controls-area">
      <div class="chip-bar">
        <div class="chip" data-value="25">25</div>
        <div class="chip" data-value="50">50</div>
        <div class="chip" data-value="100">100</div>
        <div class="chip" data-value="500">500</div>
      </div>
    </div>

    <div class="controls text-center">
      <button class="button" id="statsButton">Estadísticas</button>
      <button id="undoButton">UNDO</button>
      <button id="resetButton">RESET</button>
      <button id="spinButton" onclick="spin()">SPIN</button>
  </div>

</div>


<!-- Modal de Estadísticas -->
<div id="statsModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h4>Estadísticas</h4>
    <div id="statsSummary">
      <p><strong>Ratio Win/Loss:</strong> <span id="ratio"></span></p>
      <p><strong>Beneficio:</strong> $<span id="netResult"></span></p>
    </div>
    <ul id="statsList"></ul>
  </div>
</div>


  
  <script src="../controllers/roulette_game_controller.js"></script>
  <script src="../controllers/wheel_controller.js"></script>
</body>
</html>
