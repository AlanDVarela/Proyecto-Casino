<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino Jackpot</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Navbar overrides -->
  <link rel="stylesheet" href="../styles/navbar.css">
  <!-- Jackpot UI -->
  <link rel="stylesheet" href="../styles/Jackpot/jackpot_UI.css">
</head>
<body>

  <!-- NAVBAR BS5 FIJA ARRIBA -->
  <nav class="navbar fixed-top navbar-expand-lg navbar-dark" style="background: linear-gradient(90deg, #004d00 0%, #8b0000 100%);">
    <div class="container-fluid position-relative">
      <a class="navbar-brand d-flex align-items-baseline" href="home.html">
        <span>APUE$TA$</span>
        <span class="brand-777 ms-2">777</span>
      </a>

      <!-- Título centrado -->
      <span class="navbar-title">CASINO</span>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="home.html">Inicio</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="gamesDropdown" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
              Juegos
            </a>
            <ul class="dropdown-menu" aria-labelledby="gamesDropdown">
              <li><a class="dropdown-item" href="blackjack.html">Blackjack</a></li>
              <li><a class="dropdown-item" href="ruleta.html">Ruleta</a></li>
              <li><a class="dropdown-item" href="jackpot.html">Jackpot</a></li>
            </ul>
          </li>
        </ul>

        <span class="navbar-text text-white me-3">
          Créditos Totales: <strong id="totalCredits">$1000</strong>
        </span>
        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">Usuario</a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="#">Perfil</a></li>
              <li><a class="dropdown-item" href="#">Configuración</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenedor principal en grid: historial, cabina y estadísticas -->
  <div class="layout flex-row">
    <!-- Historial a la izquierda -->
    <div class="history-panel">
      <h5>Historial</h5>
      <ul id="history"></ul>
      <button id="clearHistoryBtn" class="clear-btn">Borrar Historial</button>
    </div>

    <!-- Cabina de juego al centro con neón -->
    <div class="cabina neon">
      <!-- Luces neón -->
      <div class="neon-lights">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      </div>

      <div class="machine">
        <div class="payout">PAYOUT</div>
        <div class="reels">
          <div class="reel">7</div>
          <div class="reel">🍒</div>
          <div class="reel">🔔</div>
        </div>
        <div class="lever" id="lever"></div>
      </div>
      <div class="controls">
        <input type="number" id="bet" value="10" min="1"><span>APUESTA</span>
      </div>
      <div class="spin-button" id="spinBtn">GIRAR</div>
    </div>

    <!-- Sidebar estadísticas a la derecha -->
    <aside class="sidebar">
      <div class="stat"><span class="label">Balance</span><span class="value" id="balanceDisplay">$1000</span></div>
      <div class="stat"><span class="label">Apuesta</span><span class="value" id="betDisplay">$0</span></div>
      <div class="stat"><span class="label">Ganancia</span><span class="value" id="winDisplay">$0</span></div>
    </aside>
  </div>

  <!-- Luces decorativas abajo -->
  <div class="bottom-lights">
    <span class="light"></span><span class="light"></span><span class="light"></span>
    <span class="light"></span><span class="light"></span><span class="light"></span>
    <span class="light"></span>
  </div>

  <!-- JS dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../controllers/jackpot_game_controller.js"></script>
</body>
</html>
